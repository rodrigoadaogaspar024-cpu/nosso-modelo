<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Histórico - Nosso Modelo</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at top, #252525 0%, #0d0d0d 50%);
      color: white;
    }

    .container {
      width: 100%;
      max-width: 600px;
      margin: auto;
      padding: 20px 18px 35px;
    }

    /* TOPO */

    .topo {
      text-align: center;
      padding: 15px 0 25px;
    }

    .icone {
      width: 75px;
      height: 75px;
      margin: auto;
      border-radius: 22px;
      background: linear-gradient(145deg, #fff, #888);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 38px;
      box-shadow: 0 10px 30px rgba(255,255,255,0.12);
    }

    h1 {
      margin-top: 15px;
      font-size: 30px;
    }

    .subtitulo {
      color: #999;
      margin-top: 7px;
      font-size: 14px;
    }

    /* PONTOS */

    .saldo {
      background: linear-gradient(145deg, #292929, #151515);
      border: 1px solid #404040;
      border-radius: 24px;
      padding: 25px;
      text-align: center;
      margin-bottom: 20px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.35);
    }

    .saldo p {
      color: #aaa;
      margin-bottom: 8px;
    }

    .saldo h2 {
      font-size: 52px;
    }

    .texto {
      color: #777;
      font-size: 13px;
      margin-top: 5px;
    }

    /* HISTÓRICO */

    .titulo {
      font-size: 19px;
      margin-bottom: 12px;
    }

    .item {
      background: #181818;
      border: 1px solid #333;
      border-radius: 18px;
      padding: 18px;
      margin-bottom: 11px;
    }

    .item strong {
      display: block;
      font-size: 16px;
      margin-bottom: 7px;
    }

    .descricao {
      color: #999;
      font-size: 14px;
      line-height: 1.5;
    }

    .vazio {
      background: #151515;
      border: 1px solid #292929;
      border-radius: 18px;
      padding: 25px 18px;
      text-align: center;
      color: #777;
      line-height: 1.5;
    }

    /* VOLTAR */

    .voltar {
      width: 100%;
      padding: 16px;
      margin-top: 20px;
      border: 1px solid #3a3a3a;
      border-radius: 14px;
      background: #242424;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .voltar:active {
      transform: scale(0.98);
    }
  </style>
</head>

<body>

  <main class="container">

    <!-- TOPO -->

    <section class="topo">

      <div class="icone">
        📜
      </div>

      <h1>Histórico</h1>

      <p class="subtitulo">
        Acompanhe suas atividades no Nosso Modelo
      </p>

    </section>


    <!-- PONTOS -->

    <section class="saldo">

      <p>⭐ Pontos atuais</p>

      <h2 id="pontos">0</h2>

      <div class="texto">
        Seu saldo atual de pontos
      </div>

    </section>


    <!-- LISTA -->

    <h2 class="titulo">
      📋 Atividades recentes
    </h2>

    <section id="listaHistorico">

      <div class="vazio">
        Nenhuma atividade registrada ainda.
      </div>

    </section>


    <!-- VOLTAR -->

    <button
      class="voltar"
      onclick="window.location.href='perfil.html'">

      ← Voltar para o perfil

    </button>

  </main>


  <script>

    const pontos =
      Number(localStorage.getItem("pontosUsuario")) || 0;


    document.getElementById("pontos").textContent =
      pontos;


    const historico =
      JSON.parse(
        localStorage.getItem("historicoUsuario")
      ) || [];


    const lista =
      document.getElementById("listaHistorico");


    if (historico.length > 0) {

      lista.innerHTML = "";


      historico.forEach(function(item) {

        const div =
          document.createElement("div");


        div.className = "item";


        div.innerHTML =
          "<strong>" +
          item.tipo +
          "</strong>" +

          "<div class='descricao'>" +
          item.descricao +
          "</div>";


        lista.appendChild(div);

      });

    }

  </script>

</body>
</html>
