<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Histórico - Nosso Modelo</title>

  <style>

* { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
:root { --verde: #20e58a; --dourado: #f3c969; --texto: #f4f7f4; --suave: #aab6ad; }
body { min-height: 100vh; color: var(--texto); background: radial-gradient(ellipse at top, #173323, #0b110d 48%, #080b09); }
.container { width: 100%; max-width: 700px; margin: auto; padding: 24px 18px 40px; }
.topo { text-align: center; padding: 22px 0 30px; }
.icone { width: 82px; height: 82px; margin: auto; border-radius: 25px; background: linear-gradient(145deg, #214b32, #101b13); border: 1px solid rgba(32,229,138,.4); display: flex; align-items: center; justify-content: center; font-size: 42px; box-shadow: 0 0 30px rgba(32,229,138,.12); }
h1 { margin-top: 18px; font-size: clamp(29px, 7vw, 38px); color: var(--texto); }
.subtitulo { color: var(--suave); margin-top: 9px; font-size: 14px; line-height: 1.6; }
.saldo { background: linear-gradient(145deg, #17221a, #101510); border: 1px solid rgba(32,229,138,.25); border-radius: 24px; padding: 27px 20px; text-align: center; margin-bottom: 28px; box-shadow: 0 15px 35px rgba(0,0,0,.3); }
.saldo p { color: var(--suave); margin-bottom: 10px; }
.saldo h2 { font-size: clamp(44px, 12vw, 58px); color: var(--verde); overflow-wrap: anywhere; }
.texto { color: #829087; font-size: 13px; margin-top: 8px; }
.titulo { color: var(--dourado); font-size: 20px; margin-bottom: 15px; }
#listaHistorico { display: grid; gap: 12px; }
.item { background: linear-gradient(145deg, #17221a, #101510); border: 1px solid rgba(32,229,138,.2); border-radius: 18px; padding: 19px; overflow-wrap: anywhere; }
.item strong { display: block; color: var(--verde); font-size: 16px; margin-bottom: 9px; }
.descricao { color: #c0cbc2; font-size: 14px; line-height: 1.7; }
.vazio { background: #121914; border: 1px solid rgba(32,229,138,.18); border-radius: 18px; padding: 25px 18px; text-align: center; color: var(--suave); line-height: 1.7; }
.voltar { width: 100%; padding: 16px; margin-top: 25px; border: 1px solid #34463a; border-radius: 15px; background: #171e19; color: var(--texto); font-size: 16px; font-weight: bold; cursor: pointer; transition: transform .2s, background .2s; }
.voltar:active { transform: scale(.98); }
.voltar:hover { background: #202b23; }
@media (max-width: 400px) { .container { padding: 18px 13px 32px; } .icone { width: 74px; height: 74px; font-size: 38px; } .saldo { padding: 23px 15px; } .item { padding: 16px; } }

  </style>
</head>

<body>

  <main class="container">

    <!-- TOPO -->

    <section class="topo">

      <div class="icone">
        📜
      </div>

      <h1>Histórico</h1>

      <p class="subtitulo">
        Acompanhe suas atividades no Nosso Modelo
      </p>

    </section>


    <!-- PONTOS -->

    <section class="saldo">

      <p>⭐ Pontos atuais</p>

      <h2 id="pontos">0</h2>

      <div class="texto">
        Seu saldo atual de pontos
      </div>

    </section>


    <!-- LISTA -->

    <h2 class="titulo">
      📋 Atividades recentes
    </h2>

    <section id="listaHistorico">

      <div class="vazio">
        Nenhuma atividade registrada ainda.
      </div>

    </section>


    <!-- VOLTAR -->

    <button
      class="voltar"
      onclick="window.location.href='perfil.html'">

      ← Voltar para o perfil

    </button>

  </main>


  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script>
    const cliente = window.supabase.createClient(
      SUPABASE_URL, SUPABASE_KEY
    );

    async function carregarHistorico() {
      const lista = document.getElementById("listaHistorico");
      const elementoPontos = document.getElementById("pontos");

      lista.textContent = "⏳ A carregar histórico...";
      elementoPontos.textContent = "...";

      try {
        const { data: auth, error: erroAuth } =
          await cliente.auth.getUser();

        if (erroAuth || !auth.user) {
          window.location.replace("login.html");
          return;
        }

        const usuario = auth.user;

        const { data: saldo, error: erroSaldo } =
          await cliente
            .from("pontos_jogadores")
            .select("pontos")
            .eq("usuario_id", usuario.id)
            .maybeSingle();

        elementoPontos.textContent = erroSaldo
          ? "Indisponível"
          : (saldo?.pontos ?? 0);

        if (erroSaldo) {
          console.error("Erro ao consultar saldo:", erroSaldo);
        }

        const { data: partidas, error: erroPartidas } =
          await cliente
            .from("partidas_jogadores")
            .select("id, jogo, pontos_partida, criado_em")
            .eq("usuario_id", usuario.id)
            .order("criado_em", { ascending: false })
            .limit(50);

        if (erroPartidas) throw erroPartidas;

        lista.replaceChildren();

        if (!partidas || partidas.length === 0) {
          const vazio = document.createElement("div");
          vazio.className = "vazio";
          vazio.textContent =
            "📜 Ainda não tens partidas registadas. Joga e volta aqui!";
          lista.appendChild(vazio);
          return;
        }

        partidas.forEach(partida => {
          const div = document.createElement("div");
          div.className = "item";

          const titulo = document.createElement("strong");
          titulo.textContent = "🎮 " + partida.jogo;

          const descricao = document.createElement("div");
          descricao.className = "descricao";

          const data = partida.criado_em
            ? new Date(partida.criado_em).toLocaleString("pt-PT")
            : "Data não disponível";

          descricao.textContent =
            "📅 " + data +
            " | 🏁 Pontuação registada: " +
            (partida.pontos_partida ?? 0);

          div.appendChild(titulo);
          div.appendChild(descricao);
          lista.appendChild(div);
        });

      } catch (erro) {
        console.error("Erro no histórico:", erro);
        lista.replaceChildren();

        const aviso = document.createElement("div");
        aviso.className = "vazio";
        aviso.textContent =
          "⚠️ Não foi possível carregar o histórico. Tenta novamente.";
        lista.appendChild(aviso);
      }
    }

    carregarHistorico();
  </script>

</body>
</html>
