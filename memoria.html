<!DOCTYPE html>
<html lang="pt">
<head>
<script id="acesso-jogos-v7">

</script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Memória Premium - Nosso Modelo</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;background:#080808;color:#fff;
  font-family:Arial,sans-serif;text-align:center
}
header{padding:20px 12px}
h1{color:#f5c451}
p{color:#d0c6ad;line-height:1.5}
main{max-width:460px;margin:auto;padding:0 12px 28px}
#placar{color:#f5c451;font-size:19px;font-weight:bold;margin:15px 0}
#tabuleiro{
  display:grid;grid-template-columns:repeat(4,minmax(0,1fr));
  gap:9px;max-width:380px;margin:auto
}
.carta{
  aspect-ratio:1;border:1px solid #c49a42;border-radius:13px;
  background:linear-gradient(145deg,#302514,#14100a);
  color:#f5c451;font-size:clamp(23px,7vw,35px);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;box-shadow:0 4px 12px #0008;
  padding:0;min-width:0
}
.carta.aberta,.carta.par{
  background:linear-gradient(145deg,#ffe39a,#c49a42);
  color:#171109
}
.carta.par{border-color:#fff0b5}
button.acao{
  padding:14px 18px;margin:7px 3px;border-radius:12px;
  border:1px solid #c49a42;background:#17130c;
  color:#ffe39a;font-size:16px;font-weight:bold
}
#mensagem{min-height:28px;margin:14px 0}
</style>
</head>
<body>
<header>
<h1>🧠 MEMÓRIA PREMIUM</h1>
<p>Encontra todos os pares e treina a tua memória!</p>
</header>
<main>
<div id="placar">Jogadas: 0 | Pares: 0</div>
<div id="tabuleiro"></div>
<p id="mensagem">Toca em duas cartas para descobrir os pares.</p>
<button class="acao" onclick="iniciar()">🔄 NOVO JOGO</button>
<br>
<button class="acao" onclick="location.href='jogos.html'">🎮 Portal de jogos</button>
<button class="acao" onclick="location.href='corrida.html'">🏎️ Corrida</button>
<button class="acao" onclick="location.href='snake.html'">🐍 Snake</button>
<button class="acao" onclick="location.href='index.html'">🏠 Início</button>
</main>
<script>
const simbolos=["🚗","⭐","🎮","⚽","🍎","🚀","🎁","🐯"];
let cartas=[],primeira=null,bloqueado=false,jogadas=0,pares=0;
let temporizador=null,recorde=Number(localStorage.getItem("recordeMemoria"))||0;
const tabuleiro=document.getElementById("tabuleiro");
const placar=document.getElementById("placar");
const mensagem=document.getElementById("mensagem");

function iniciar(){
 if(temporizador)clearTimeout(temporizador);
 primeira=null;bloqueado=false;jogadas=0;pares=0;
 cartas=[...simbolos,...simbolos].sort(()=>Math.random()-0.5);
 tabuleiro.innerHTML="";
 cartas.forEach((simbolo,i)=>{
  const b=document.createElement("button");
  b.className="carta";
  b.textContent="?";
  b.setAttribute("aria-label","Carta escondida");
  b.onclick=()=>virarCarta(b,simbolo);
  tabuleiro.appendChild(b);
 });
 mensagem.textContent="Boa sorte! Encontra os 8 pares.";
 atualizar();
}
function atualizar(){
 placar.textContent="Jogadas: "+jogadas+" | Pares: "+pares+
   " | Recorde: "+recorde+" jogadas";
}
function virarCarta(botao,simbolo){
 if(bloqueado||botao.classList.contains("aberta")||
    botao.classList.contains("par"))return;
 botao.textContent=simbolo;
 botao.classList.add("aberta");
 botao.setAttribute("aria-label",simbolo);
 if(!primeira){primeira={botao,simbolo};return;}
 jogadas++;
 if(primeira.simbolo===simbolo){
  primeira.botao.classList.remove("aberta");
  primeira.botao.classList.add("par");
  botao.classList.remove("aberta");
  botao.classList.add("par");
  primeira=null;pares++;
  if(pares===simbolos.length){
   if(recorde===0||jogadas<recorde){
    recorde=jogadas;
    localStorage.setItem("recordeMemoria",recorde);
   }
   mensagem.textContent="🏆 Parabéns! Encontraste todos os pares em "+jogadas+" jogadas!";
  }
  atualizar();
 }else{
  const anterior=primeira.botao;
  primeira=null;bloqueado=true;
  atualizar();
  temporizador=setTimeout(()=>{
   anterior.textContent="?";botao.textContent="?";
   anterior.classList.remove("aberta");
   botao.classList.remove("aberta");
   anterior.setAttribute("aria-label","Carta escondida");
   botao.setAttribute("aria-label","Carta escondida");
   bloqueado=false;
  },850);
 }
}
iniciar();
</script>
</body>
</html>
