<!DOCTYPE html>
<html lang="pt">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Conta - Nosso Modelo</title>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;

      background:
        radial-gradient(circle at top, #303030 0%, #111 42%, #080808 100%);

      color: white;

      padding: 20px;

      display: flex;
      align-items: center;
      justify-content: center;
    }

    .cadastro {
      width: 100%;
      max-width: 520px;

      background:
        linear-gradient(145deg, #292929, #141414);

      border: 1px solid #414141;

      padding: 28px 22px;

      border-radius: 25px;

      box-shadow:
        0 20px 50px rgba(0,0,0,0.45);
    }

    .logo {
      width: 78px;
      height: 78px;

      margin: 0 auto 15px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 23px;

      background:
        linear-gradient(145deg, #303030, #171717);

      border: 1px solid #444;

      font-size: 40px;
    }

    h1 {
      text-align: center;
      font-size: 30px;
      margin-bottom: 8px;
    }

    .subtitulo {
      text-align: center;

      color: #aaa;

      font-size: 14px;

      line-height: 1.5;

      margin-bottom: 23px;
    }

    /* TABS */

    .abas {
      display: grid;

      grid-template-columns: 1fr 1fr;

      gap: 8px;

      margin-bottom: 22px;
    }

    .aba {
      padding: 12px;

      margin: 0;

      border-radius: 12px;

      background: #202020;

      color: #aaa;

      border: 1px solid #363636;

      font-size: 14px;
    }

    .aba.ativa {
      background: white;
      color: #111;
    }

    /* CAMPOS */

    label {
      display: block;

      margin-top: 16px;
      margin-bottom: 7px;

      color: #ddd;

      font-size: 14px;

      font-weight: bold;
    }

    input {
      width: 100%;

      padding: 15px;

      background: #0f0f0f;

      color: white;

      border: 1px solid #3b3b3b;

      border-radius: 13px;

      font-size: 16px;

      outline: none;
    }

    input:focus {
      border-color: #777;

      background: #121212;
    }

    input::placeholder {
      color: #666;
    }


    .campo-senha {
      position: relative;
      width: 100%;
    }

    .campo-senha input {
      padding-right: 55px;
    }

    .ver-senha {
      position: absolute;
      right: 6px;
      top: 50%;
      transform: translateY(-50%);
      width: 45px;
      margin: 0;
      padding: 10px;
      background: transparent;
      color: white;
      border: none;
      font-size: 20px;
      cursor: pointer;
    }

    .ver-senha:active {
      transform: translateY(-50%);
    }

    /* BOTÕES */

    button {
      width: 100%;

      padding: 15px;

      margin-top: 20px;

      border-radius: 14px;

      font-size: 16px;

      font-weight: bold;

      cursor: pointer;

      transition: 0.2s;
    }

    button:active {
      transform: scale(0.98);
    }

    .criar {
      background: white;

      color: #111;

      border: none;
    }

    .criar:hover {
      background: #e8e8e8;
    }

    .google {
      background: #202020;

      color: white;

      border: 1px solid #444;
    }

    .google:hover {
      background: #292929;
    }

    .voltar {
      background: #202020;

      color: white;

      border: 1px solid #3b3b3b;
    }

    .divisor {
      display: flex;

      align-items: center;

      gap: 10px;

      color: #666;

      font-size: 12px;

      margin: 22px 0 5px;
    }

    .divisor::before,
    .divisor::after {
      content: "";

      height: 1px;

      flex: 1;

      background: #333;
    }

    /* MENSAGEM */

    #resultado {
      min-height: 22px;

      margin-top: 15px;

      text-align: center;

      color: #ccc;

      font-size: 14px;

      line-height: 1.5;
    }

    .aviso {
      margin-top: 20px;

      padding: 13px;

      border-radius: 13px;

      background: #101010;

      border: 1px solid #303030;

      color: #777;

      font-size: 12px;

      text-align: center;

      line-height: 1.5;
    }

    .seguranca {
      text-align: center;

      margin-top: 14px;

      color: #777;

      font-size: 11px;
    }

    .oculto {
      display: none;
    }

    @media (max-width: 400px) {

      .cadastro {
        padding: 23px 17px;
      }

      h1 {
        font-size: 27px;
      }

      .logo {
        width: 70px;
        height: 70px;
        font-size: 36px;
      }

    }

  </style>

</head>

<body>

  <main class="cadastro">

    <div class="logo">
      🎮
    </div>

    <h1>Nosso Modelo</h1>

    <p class="subtitulo" id="subtitulo">
      Crie sua conta e comece a participar.
    </p>


    <!-- ABAS -->

    <div class="abas">

      <button
        class="aba ativa"
        id="abaCriar"
        type="button"
        onclick="mostrarCriar()">

        🆕 Criar conta

      </button>

      <button
        class="aba"
        id="abaEntrar"
        type="button"
        onclick="mostrarEntrar()">

        🚪 Entrar

      </button>

    </div>


    <!-- CRIAR CONTA -->

    <form id="cadastroForm">

      <label for="nome">
        👤 Nome
      </label>

      <input
        type="text"
        id="nome"
        placeholder="Digite seu nome"
        autocomplete="name"
        required
      >


      <label for="email">
        📧 E-mail
      </label>

      <input
        type="email"
        id="email"
        placeholder="Digite seu e-mail"
        autocomplete="email"
        required
      >


      <label for="confirmarEmail">
        🔁 Confirmar e-mail
      </label>

      <input
        type="email"
        id="confirmarEmail"
        placeholder="Digite novamente seu e-mail"
        autocomplete="email"
        required
      >


      <label for="telemovel">
        📱 Número de telemóvel
      </label>

      <input
        type="tel"
        id="telemovel"
        placeholder="Ex.: +351 912 345 678"
        autocomplete="tel"
      >


      <label for="senha">
        🔒 Senha
      </label>

      <div class="campo-senha">

        <input
          type="password"
          id="senha"
          placeholder="Crie uma senha"
          autocomplete="new-password"
          minlength="6"
          required
        >

        <button
          type="button"
          class="ver-senha"
          onclick="mostrarSenha('senha', this)">👁️</button>

      </div>


      <label for="confirmarSenha">
        🔁 Confirmar senha
      </label>

      <div class="campo-senha">

        <input
          type="password"
          id="confirmarSenha"
          placeholder="Digite novamente sua senha"
          autocomplete="new-password"
          minlength="6"
          required
        >

        <button
          type="button"
          class="ver-senha"
          onclick="mostrarSenha('confirmarSenha', this)">👁️</button>

      </div>


      <button
        class="criar"
        type="submit">

        🚀 Criar minha conta

      </button>

    </form>


    <!-- ENTRAR -->

    <form
      id="loginForm"
      class="oculto">

      <label for="loginEmail">
        📧 E-mail
      </label>

      <input
        type="email"
        id="loginEmail"
        placeholder="Digite seu e-mail"
        autocomplete="email"
        required
      >


      <label for="loginSenha">
        🔒 Senha
      </label>

      <div class="campo-senha">

        <input
          type="password"
          id="loginSenha"
          placeholder="Digite sua senha"
          autocomplete="current-password"
          required
        >

        <button
          type="button"
          class="ver-senha"
          onclick="mostrarSenha('loginSenha', this)">👁️</button>

      </div>


      <button
        class="criar"
        type="submit">

        🚪 Entrar na minha conta

      </button>

    </form>


    <!-- GOOGLE -->

    <div class="divisor">
      OU
    </div>


    <button
      class="google"
      type="button"
      onclick="entrarGoogle()">

      🔵 Continuar com Google

    </button>


    <p id="resultado"></p>


    <button
      class="voltar"
      type="button"
      onclick="window.location.href='index.html'">

      🏠 Voltar para o início

    </button>


    <div class="aviso">

      🔐 A senha não é guardada em texto normal
      neste protótipo.

    </div>

    <div class="seguranca">

      Nosso Modelo © 2026

    </div>

  </main>


  <script>


    function mostrarSenha(id, botao) {

      const campo = document.getElementById(id);

      if (campo.type === "password") {

        campo.type = "text";
        botao.textContent = "🙈";

      } else {

        campo.type = "password";
        botao.textContent = "👁️";

      }

    }

    /*
      TROCA ENTRE CRIAR CONTA E ENTRAR
    */

    function mostrarCriar() {

      document
        .getElementById("cadastroForm")
        .classList.remove("oculto");

      document
        .getElementById("loginForm")
        .classList.add("oculto");

      document
        .getElementById("abaCriar")
        .classList.add("ativa");

      document
        .getElementById("abaEntrar")
        .classList.remove("ativa");

      document
        .getElementById("subtitulo")
        .textContent =
        "Crie sua conta e comece a participar.";

      limparResultado();

    }


    function mostrarEntrar() {

      document
        .getElementById("cadastroForm")
        .classList.add("oculto");

      document
        .getElementById("loginForm")
        .classList.remove("oculto");

      document
        .getElementById("abaCriar")
        .classList.remove("ativa");

      document
        .getElementById("abaEntrar")
        .classList.add("ativa");

      document
        .getElementById("subtitulo")
        .textContent =
        "Entre na sua conta do Nosso Modelo.";

      limparResultado();

    }


    function limparResultado() {

      document
        .getElementById("resultado")
        .textContent = "";

    }


    /*
      CRIAR CONTA
    */

    document
      .getElementById("cadastroForm")
      .addEventListener(
        "submit",
        async function(event) {

          event.preventDefault();


          const nome =
            document
              .getElementById("nome")
              .value
              .trim();


          const email =
            document
              .getElementById("email")
              .value
              .trim()
              .toLowerCase();


          const confirmarEmail =
            document
              .getElementById("confirmarEmail")
              .value
              .trim()
              .toLowerCase();


          const telemovel =
            document
              .getElementById("telemovel")
              .value
              .trim();


          const senha =
            document
              .getElementById("senha")
              .value;


          const confirmarSenha =
            document
              .getElementById("confirmarSenha")
              .value;


          if (!nome || !email || !confirmarEmail || !senha || !confirmarSenha) {

            alert(
              "⚠️ Preencha todos os campos obrigatórios."
            );

            return;

          }


          if (email !== confirmarEmail) {

            alert(
              "❌ Os e-mails não coincidem. Confirme o seu e-mail."
            );

            return;

          }


          if (senha.length < 6) {

            alert(
              "⚠️ A senha deve ter pelo menos 6 caracteres."
            );

            return;

          }


          if (senha !== confirmarSenha) {

            alert(
              "❌ As senhas não coincidem. Confirme a sua senha."
            );

            return;

          }


          /*
            Guardamos os dados da conta no protótipo.

            A senha é transformada em hash e
            não fica guardada em texto normal.
          */

          const senhaHash =
            await criarHash(senha);


          localStorage.setItem(
            "nomeUsuario",
            nome
          );


          localStorage.setItem(
            "emailUsuario",
            email
          );


          localStorage.setItem(
            "telemovelUsuario",
            telemovel
          );


          localStorage.setItem(
            "senhaUsuarioHash",
            senhaHash
          );


          if (
            localStorage.getItem("pontosUsuario") === null
          ) {

            localStorage.setItem(
              "pontosUsuario",
              "0"
            );

          }


          if (
            localStorage.getItem("historicoUsuario") === null
          ) {

            localStorage.setItem(
              "historicoUsuario",
              JSON.stringify([])
            );

          }


          localStorage.setItem(
            "usuarioLogado",
            "true"
          );


          alert(
            "🎉 Conta criada com sucesso, " +
            nome +
            "!"
          );


          window.location.href =
            "index.html";

        }
      );


    /*
      ENTRAR
    */

    document
      .getElementById("loginForm")
      .addEventListener(
        "submit",
        async function(event) {

          event.preventDefault();


          const email =
            document
              .getElementById("loginEmail")
              .value
              .trim()
              .toLowerCase();


          const senha =
            document
              .getElementById("loginSenha")
              .value;


          const emailGuardado =
            localStorage.getItem("emailUsuario");


          const senhaGuardada =
            localStorage.getItem("senhaUsuarioHash");


          if (!emailGuardado || !senhaGuardada) {

            alert(
              "⚠️ Nenhuma conta foi encontrada neste navegador."
            );

            return;

          }


          if (email !== emailGuardado) {

            alert(
              "❌ E-mail incorreto."
            );

            return;

          }


          const senhaHash =
            await criarHash(senha);


          if (senhaHash !== senhaGuardada) {

            alert(
              "❌ Senha incorreta. Tente novamente."
            );

            return;

          }


          localStorage.setItem(
            "usuarioLogado",
            "true"
          );


          alert(
            "✅ Entrada realizada com sucesso!"
          );


          window.location.href =
            "index.html";

        }
      );


    /*
      HASH DA SENHA

      Isto é adequado para o nosso protótipo,
      mas para um sistema real precisaremos
      de autenticação no servidor.
    */

    async function criarHash(texto) {

      const dados =
        new TextEncoder().encode(texto);


      const hash =
        await crypto.subtle.digest(
          "SHA-256",
          dados
        );


      return Array
        .from(new Uint8Array(hash))
        .map(
          byte =>
            byte
              .toString(16)
              .padStart(2, "0")
        )
        .join("");

    }


    /*
      GOOGLE

      O botão fica preparado.

      Para funcionar de verdade precisamos
      configurar OAuth/Firebase/Google
      no projeto.
    */

    function entrarGoogle() {

      alert(
        "🔵 O acesso com Google será ativado na próxima etapa, quando configurarmos a autenticação Google."
      );

    }

  </script>

</body>
</html>
