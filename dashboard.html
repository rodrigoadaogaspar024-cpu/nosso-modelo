<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Dashboard - Nosso Modelo</title>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    :root {
      --verde: #00d563;
      --verde-escuro: #08783b;
      --dourado: #f5c451;
      --fundo: #080b09;
      --cartao: #141a16;
      --borda: #29382e;
      --texto-secundario: #aab7ad;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(ellipse at top, #173323 0%, #0b110d 42%, #080b09 100%);
      color: #f5fff7;
    }

    .container {
      width: 100%;
      max-width: 600px;
      margin: auto;
      padding: 22px 18px 35px;
    }

    .topo {
      text-align: center;
      padding: 18px 0 28px;
    }

    .icone {
      width: 90px;
      height: 90px;
      margin: auto;
      border-radius: 28px;
      background: linear-gradient(145deg, #00d563, #075d32);
      border: 1px solid #3ce883;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 44px;
      box-shadow: 0 12px 35px rgba(0, 213, 99, 0.22);
    }

    h1 {
      margin-top: 17px;
      font-size: 30px;
      letter-spacing: 0.3px;
      overflow-wrap: anywhere;
    }

    .nome {
      color: #d5f7df;
      margin-top: 9px;
      font-size: 16px;
      overflow-wrap: anywhere;
    }

    .subtitulo {
      color: var(--texto-secundario);
      margin-top: 7px;
      font-size: 14px;
    }

    .card {
      background: linear-gradient(145deg, #19231c, #101511);
      border: 1px solid var(--borda);
      border-radius: 22px;
      padding: 22px;
      margin-bottom: 15px;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.22);
    }

    .card h2 {
      font-size: 18px;
      margin-bottom: 12px;
      color: #e8f5eb;
    }

    .numero {
      font-size: 38px;
      font-weight: bold;
      color: var(--verde);
      overflow-wrap: anywhere;
    }

    .destaque {
      background: linear-gradient(145deg, #183b25, #112117);
      border: 1px solid #287c45;
      box-shadow: 0 12px 32px rgba(0, 200, 83, 0.09);
    }

    .destaque h2 {
      color: #b9f7ca;
    }

    .destaque .numero {
      color: var(--dourado);
      font-size: 44px;
      text-shadow: 0 0 22px rgba(245, 196, 81, 0.12);
    }

    .nivel {
      font-size: 26px;
      font-weight: bold;
      color: var(--dourado);
      overflow-wrap: anywhere;
    }

    .acoes {
      margin-top: 24px;
    }

    .acoes h2 {
      font-size: 20px;
      margin-bottom: 15px;
    }

    button {
      width: 100%;
      padding: 16px;
      border: 1px solid transparent;
      border-radius: 14px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 11px;
      transition: transform 0.2s, background 0.2s;
    }

    button:active {
      transform: scale(0.98);
    }

    .principal {
      background: linear-gradient(135deg, #00d563, #009b45);
      color: #06190c;
      box-shadow: 0 8px 22px rgba(0, 213, 99, 0.17);
    }

    .secundario {
      background: #18211b;
      color: #eaffef;
      border-color: #304737;
    }

    .parceiros {
      background: linear-gradient(135deg, #3a2e12, #211b10);
      color: #ffe6a0;
      border-color: #78602a;
    }

    .rodape {
      text-align: center;
      color: #718176;
      font-size: 13px;
      line-height: 1.7;
      padding: 24px 0 10px;
    }

    @media (max-width: 400px) {
      .container {
        padding-left: 14px;
        padding-right: 14px;
      }

      h1 {
        font-size: 27px;
      }

      .card {
        padding: 19px;
      }

      .numero {
        font-size: 34px;
      }

      .destaque .numero {
        font-size: 40px;
      }
    }

  </style>
</head>

<body>

  <main class="container">

    <section class="topo">

      <div class="icone">
        📊
      </div>

      <h1>Dashboard</h1>

      <p class="nome" id="nomeDashboard">
        Utilizador
      </p>

      <p class="subtitulo">
        Resumo da sua atividade
      </p>

    </section>


    <section class="card destaque">

      <h2>⭐ Pontos</h2>

      <div
        class="numero"
        id="pontosDashboard">
        0
      </div>

    </section>


    <section class="card">

      <h2>🎮 Partidas</h2>

      <div
        class="numero"
        id="partidasDashboard">
        0
      </div>

    </section>


    <section class="card">

      <h2>🎁 Recompensas resgatadas</h2>

      <div
        class="numero"
        id="recompensasDashboard">
        0
      </div>

    </section>


    <section class="card">

      <h2>🏆 Nível do jogador</h2>

      <div
        class="nivel"
        id="nivelDashboard">
        🥉 Iniciante
      </div>

    </section>


    <section class="acoes">

      <h2>⚡ Acesso rápido</h2>

      <button
        class="principal"
        onclick="window.location.href='jogos.html'">

        🎮 Jogar agora

      </button>

      <button
        class="secundario"
        onclick="window.location.href='historico.html'">

        📜 Ver histórico

      </button>

      <button
        class="secundario"
        onclick="window.location.href='perfil.html'">

        👤 Meu perfil

      </button>

      <button
        class="parceiros"
        onclick="window.location.href='lista-parceiros.html'">

        🤝 Ver parceiros

      </button>

      <button
        class="secundario"
        onclick="window.location.href='recompensas.html'">

        🎁 Ver recompensas

      </button>

    </section>


    <button
      class="secundario"
      onclick="window.location.href='index.html'">

      ← Voltar para o início

    </button>


    <div class="rodape">

      Nosso Modelo © 2026<br>
      Entretenimento e recompensas

    </div>

  </main>



  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script>
  async function iniciarDashboard() {
    const pontosEl = document.getElementById("pontosDashboard");
    const partidasEl = document.getElementById("partidasDashboard");
    const recompensasEl = document.getElementById("recompensasDashboard");

    pontosEl.textContent = "A carregar...";
    partidasEl.textContent = "A carregar...";
    recompensasEl.textContent = "—";
    recompensasEl.parentElement.querySelector("h2")
      .textContent = "🎁 Resgates indisponíveis";

    try {
      const cliente = window.supabase.createClient(
        SUPABASE_URL, SUPABASE_KEY
      );

      const {data, error} = await cliente.auth.getUser();

      if (error || !data.user) {
        location.replace("login.html");
        return;
      }

      const usuario = data.user;
      document.getElementById("nomeDashboard").textContent =
        usuario.user_metadata?.nome || "Jogador";

      const [saldo, historico] = await Promise.all([
        cliente.from("pontos_jogadores")
          .select("pontos")
          .eq("usuario_id", usuario.id)
          .maybeSingle(),

        cliente.from("partidas_jogadores")
          .select("id", {count:"exact", head:true})
          .eq("usuario_id", usuario.id)
      ]);

      pontosEl.textContent = saldo.error
        ? "Indisponível"
        : (saldo.data?.pontos ?? 0);

      partidasEl.textContent = historico.error
        ? "Indisponível"
        : (historico.count ?? 0);

      const total = historico.error ? null : historico.count;
      let nivel = "🥉 Iniciante";

      if (total >= 100) nivel = "🥇 Mestre";
      else if (total >= 50) nivel = "🥈 Avançado";
      else if (total >= 20) nivel = "🎖️ Intermediário";

      document.getElementById("nivelDashboard")
        .textContent = total === null
        ? "Indisponível" : nivel;

    } catch (erro) {
      console.error("Erro no Dashboard:", erro);
      pontosEl.textContent = "Indisponível";
      partidasEl.textContent = "Indisponível";
    }
  }

  iniciarDashboard();
  </script>


</body>
</html>
