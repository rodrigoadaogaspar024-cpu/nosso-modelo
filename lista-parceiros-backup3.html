<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Parceiros - Nosso Modelo</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 550px;
      margin: auto;
    }

    h1 {
      text-align: center;
    }

    .card {
      background: #222;
      padding: 20px;
      border-radius: 15px;
      margin: 15px 0;
    }

    .vazio {
      text-align: center;
      color: #ccc;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      margin-top: 10px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .voltar {
      background: white;
      color: #111;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>🤝 Parceiros</h1>

    <div id="lista">
      <p class="vazio">Nenhum parceiro cadastrado ainda.</p>
    </div>

    <button class="voltar" onclick="window.location.href='parceiro.html'">
      ➕ Seja Parceiro
    </button>

    <button class="voltar" onclick="window.location.href='index.html'">
      🏠 Voltar para início
    </button>

  </div>

  <script>
const lista = document.getElementById("lista");

const parceiros =
  JSON.parse(localStorage.getItem("listaParceiros")) || [];

if (parceiros.length > 0) {

  lista.innerHTML = "";

  parceiros.forEach(function(parceiro) {

    const card = document.createElement("div");

    card.className = "card";

    card.innerHTML = `
      <h2>🤝 ${parceiro.empresa}</h2>
      <p><strong>👤 Nome:</strong> ${parceiro.nome}</p>
      <p><strong>📧 E-mail:</strong> ${parceiro.email}</p>
      <p><strong>💬 Mensagem:</strong> ${parceiro.mensagem}</p>
      <p><strong>🕒 Data:</strong> ${parceiro.dataHora}</p>
    `;

    lista.appendChild(card);

  });

}

  </script>

</body>
</html>
