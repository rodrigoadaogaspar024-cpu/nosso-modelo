<!DOCTYPE html>
<html lang="pt">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Parceiros - Nosso Modelo</title>

  <style>

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: Arial, sans-serif;
}

:root {
  --verde: #20e58a;
  --dourado: #f3c969;
  --texto: #f4f7f4;
  --suave: #aab6ad;
}

body {
  min-height: 100vh;
  color: var(--texto);
  background: radial-gradient(ellipse at top, #173323, #0b110d 45%, #080b09);
}

.container {
  width: 100%;
  max-width: 700px;
  margin: auto;
  padding: 24px 18px 42px;
}

.topo {
  text-align: center;
  padding: 24px 0 30px;
}

.icone {
  width: 82px;
  height: 82px;
  margin: 0 auto 18px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 25px;
  background: linear-gradient(145deg, #214b32, #101b13);
  border: 1px solid rgba(32,229,138,.45);
  box-shadow: 0 0 30px rgba(32,229,138,.12);
  font-size: 42px;
}

h1 {
  color: var(--texto);
  font-size: clamp(29px, 7vw, 38px);
  margin-bottom: 10px;
}

.subtitulo {
  color: var(--suave);
  font-size: 14px;
  line-height: 1.7;
}

.contador {
  display: inline-block;
  margin-top: 20px;
  padding: 11px 19px;
  border-radius: 30px;
  background: rgba(32,229,138,.08);
  border: 1px solid rgba(32,229,138,.25);
  color: var(--suave);
  font-size: 14px;
}

.contador strong {
  color: var(--verde);
}

#lista {
  display: grid;
  gap: 18px;
}

.card {
  background: linear-gradient(145deg, #17221a, #101510);
  border: 1px solid rgba(32,229,138,.22);
  border-radius: 22px;
  padding: 22px 19px;
  margin-bottom: 0;
  box-shadow: 0 16px 38px rgba(0,0,0,.28);
  overflow-wrap: anywhere;
}

.cabecalho-card {
  display: flex;
  align-items: center;
  gap: 13px;
  padding-bottom: 17px;
  margin-bottom: 17px;
  border-bottom: 1px solid #29362c;
}

.empresa-icone {
  width: 52px;
  height: 52px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 16px;
  background: #203a28;
  border: 1px solid rgba(32,229,138,.3);
  font-size: 26px;
}

.cabecalho-card h2 {
  color: var(--dourado);
  font-size: 20px;
  line-height: 1.4;
  overflow-wrap: anywhere;
}

.etiqueta {
  color: var(--verde);
  font-size: 10px;
  font-weight: bold;
  letter-spacing: 2px;
  margin-bottom: 5px;
}

.informacao {
  color: var(--suave);
  font-size: 14px;
  line-height: 1.8;
  margin-bottom: 10px;
  overflow-wrap: anywhere;
}

.informacao strong {
  color: var(--texto);
}

.mensagem {
  margin-top: 15px;
  padding: 15px;
  background: rgba(0,0,0,.22);
  border: 1px solid rgba(243,201,105,.2);
  border-radius: 15px;
  color: #c6d0c8;
  font-size: 14px;
  line-height: 1.8;
  overflow-wrap: anywhere;
}

.mensagem strong {
  color: var(--dourado);
}

.data {
  margin-top: 14px;
  color: #829087;
  font-size: 12px;
  line-height: 1.6;
}

button {
  width: 100%;
  padding: 15px;
  border-radius: 14px;
  margin-top: 11px;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
  transition: transform .2s;
  overflow-wrap: anywhere;
}

button:active {
  transform: scale(.98);
}

.email {
  background: linear-gradient(135deg, #f3d783, #dcae43);
  color: #15170f;
  border: none;
}

.email:hover {
  background: #ffe7a0;
}

.whatsapp {
  background: #123b27;
  color: #7dffb7;
  border: 1px solid rgba(32,229,138,.35);
}

.whatsapp:hover {
  background: #194b32;
}

.vazio {
  text-align: center;
  color: var(--suave);
  line-height: 1.8;
  padding: 28px 10px;
}

.vazio strong {
  display: block;
  color: var(--dourado);
  font-size: 19px;
  margin-bottom: 10px;
}

.parceiro {
  background: linear-gradient(135deg, #24e58a, #12ad65);
  color: #07140c;
  border: none;
  margin-top: 24px;
  box-shadow: 0 8px 24px rgba(32,229,138,.14);
}

.parceiro:hover {
  background: #52f3a4;
}

.voltar {
  background: #171e19;
  color: var(--texto);
  border: 1px solid #34463a;
  margin-top: 12px;
}

.voltar:hover {
  background: #202b23;
}

.rodape {
  text-align: center;
  color: #78857b;
  font-size: 12px;
  line-height: 1.8;
  padding: 30px 0 5px;
}

@media (max-width: 400px) {
  .container {
    padding: 18px 13px 32px;
  }

  .icone {
    width: 74px;
    height: 74px;
    font-size: 38px;
  }

  .card {
    padding: 19px 15px;
  }

  .cabecalho-card h2 {
    font-size: 18px;
  }
}

</style>

</head>

<body>

  <main class="container">

    <!-- TOPO -->

    <section class="topo">

      <div class="icone">
        🤝
      </div>

      <h1>Parceiros</h1>

      <p class="subtitulo">
        Conheça os parceiros do Nosso Modelo
      </p>

      <div
        class="contador"
        id="contador">

        🤝 Parceiros: <strong>0</strong>

      </div>

    </section>


    <!-- LISTA -->

    <section id="lista">

      <div class="card">

        <p class="vazio">

          <strong>🤝 Ainda não há parceiros</strong>

          Seja o primeiro a fazer parte
          do Nosso Modelo.

        </p>

      </div>

    </section>


    <!-- SEJA PARCEIRO -->

    <button
      class="parceiro"
      onclick="window.location.href='parceiro.html'">

      🤝 Seja Parceiro

    </button>


    <!-- VOLTAR -->

    <button
      class="voltar"
      onclick="window.location.href='index.html'">

      🏠 Voltar para início

    </button>


    <div class="rodape">

      Nosso Modelo © 2026<br>

      Empresas e parceiros

    </div>

  </main>


  <script>
    const lista = document.getElementById("lista");
    const contador = document.getElementById("contador");

    async function carregarParceiros() {
      try {
        const resposta = await fetch(
          "parceiros-aprovados.json",
          { cache: "no-store" }
        );

        if (!resposta.ok) {
          throw new Error("Não foi possível carregar os parceiros");
        }

        const parceiros = await resposta.json();

        if (!Array.isArray(parceiros)) {
          throw new Error("Formato inválido");
        }

        contador.textContent =
          "🤝 Parceiros: " + parceiros.length;

        if (parceiros.length === 0) {
          return;
        }

        lista.replaceChildren();

        parceiros.forEach(function(parceiro) {
          const card = document.createElement("div");
          card.className = "card";

          const cabecalho = document.createElement("div");
          cabecalho.className = "cabecalho-card";

          const icone = document.createElement("div");
          icone.className = "empresa-icone";
          icone.textContent = "🏢";

          const bloco = document.createElement("div");

          const etiqueta = document.createElement("div");
          etiqueta.className = "etiqueta";
          etiqueta.textContent = "PARCEIRO APROVADO";

          const titulo = document.createElement("h2");
          titulo.textContent = parceiro.empresa || "Parceiro";

          bloco.append(etiqueta, titulo);
          cabecalho.append(icone, bloco);
          card.appendChild(cabecalho);

          if (parceiro.descricao) {
            const descricao = document.createElement("p");
            descricao.className = "informacao";
            descricao.textContent = parceiro.descricao;
            card.appendChild(descricao);
          }

          if (parceiro.site) {
            try {
              const url = new URL(parceiro.site);

              if (["https:", "http:"].includes(url.protocol)) {
                const botao = document.createElement("button");
                botao.className = "email";
                botao.textContent = "🌐 Visitar empresa";

                botao.onclick = function() {
                  window.open(url.href, "_blank", "noopener,noreferrer");
                };

                card.appendChild(botao);
              }
            } catch (erro) {
              console.warn("Site de parceiro inválido");
            }
          }

          lista.appendChild(card);
        });

      } catch (erro) {
        console.error(erro);
        contador.textContent = "🤝 Parceiros indisponíveis";
        lista.textContent =
          "Não foi possível carregar os parceiros. Tente novamente.";
      }
    }

    carregarParceiros();
  </script>

</body>
</html>
