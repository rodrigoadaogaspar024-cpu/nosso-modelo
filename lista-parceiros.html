<!DOCTYPE html>
<html lang="pt">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Parceiros - Nosso Modelo</title>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;

      background:
        radial-gradient(circle at top, #303030 0%, #111 42%, #080808 100%);

      color: white;
    }

    .container {
      width: 100%;
      max-width: 650px;
      margin: auto;
      padding: 20px 18px 40px;
    }

    /* TOPO */

    .topo {
      text-align: center;
      padding: 18px 0 25px;
    }

    .icone {
      width: 82px;
      height: 82px;

      margin: 0 auto 15px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 24px;

      background:
        linear-gradient(145deg, #303030, #171717);

      border: 1px solid #444;

      box-shadow:
        0 15px 35px rgba(0,0,0,0.45);

      font-size: 42px;
    }

    h1 {
      font-size: 31px;
      margin-bottom: 8px;
    }

    .subtitulo {
      color: #aaa;
      font-size: 14px;
      line-height: 1.5;
    }

    /* CONTADOR */

    .contador {
      margin-top: 18px;

      display: inline-block;

      padding: 9px 15px;

      border-radius: 30px;

      background: #1b1b1b;

      border: 1px solid #3b3b3b;

      color: #ccc;

      font-size: 13px;
    }

    .contador strong {
      color: white;
    }

    /* CARTÃO DO PARCEIRO */

    .card {
      background:
        linear-gradient(145deg, #292929, #141414);

      border: 1px solid #414141;

      border-radius: 24px;

      padding: 22px 20px;

      margin-bottom: 16px;

      box-shadow:
        0 18px 45px rgba(0,0,0,0.40);
    }

    .cabecalho-card {
      display: flex;
      align-items: center;
      gap: 13px;

      padding-bottom: 17px;

      margin-bottom: 16px;

      border-bottom: 1px solid #333;
    }

    .empresa-icone {
      width: 50px;
      height: 50px;

      flex-shrink: 0;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 15px;

      background: #1a1a1a;

      border: 1px solid #3b3b3b;

      font-size: 25px;
    }

    .cabecalho-card h2 {
      font-size: 20px;

      line-height: 1.3;

      word-break: break-word;
    }

    .etiqueta {
      color: #777;

      font-size: 11px;

      text-transform: uppercase;

      margin-bottom: 3px;
    }

    .informacao {
      color: #aaa;

      font-size: 14px;

      line-height: 1.6;

      margin-bottom: 10px;

      word-break: break-word;
    }

    .informacao strong {
      color: #eee;
    }

    .mensagem {
      margin-top: 14px;

      padding: 14px;

      background: #101010;

      border: 1px solid #303030;

      border-radius: 14px;

      color: #bbb;

      font-size: 14px;

      line-height: 1.6;

      word-break: break-word;
    }

    .data {
      margin-top: 13px;

      color: #666;

      font-size: 12px;
    }

    /* BOTÕES */

    button {
      width: 100%;

      padding: 15px;

      border-radius: 14px;

      margin-top: 10px;

      font-size: 15px;

      font-weight: bold;

      cursor: pointer;

      transition: 0.2s;
    }

    button:active {
      transform: scale(0.98);
    }

    .email {
      background: white;

      color: #111;

      border: none;
    }

    .email:hover {
      background: #e8e8e8;
    }

    .whatsapp {
      background: #202020;

      color: white;

      border: 1px solid #444;
    }

    .whatsapp:hover {
      background: #292929;
    }

    /* SEM PARCEIROS */

    .vazio {
      text-align: center;

      color: #888;

      line-height: 1.7;

      padding: 28px 10px;
    }

    .vazio strong {
      display: block;

      color: white;

      font-size: 18px;

      margin-bottom: 8px;
    }

    /* BOTÕES FINAIS */

    .parceiro {
      background: white;

      color: #111;

      border: none;

      margin-top: 4px;
    }

    .parceiro:hover {
      background: #e8e8e8;
    }

    .voltar {
      background: #202020;

      color: white;

      border: 1px solid #3b3b3b;

      margin-top: 12px;
    }

    .voltar:hover {
      background: #292929;
    }

    /* RODAPÉ */

    .rodape {
      text-align: center;

      color: #666;

      font-size: 12px;

      line-height: 1.6;

      padding: 25px 0 5px;
    }

    @media (max-width: 400px) {

      h1 {
        font-size: 28px;
      }

      .icone {
        width: 72px;
        height: 72px;
        font-size: 38px;
      }

      .card {
        padding: 19px 16px;
      }

    }

  </style>

</head>

<body>

  <main class="container">

    <!-- TOPO -->

    <section class="topo">

      <div class="icone">
        🤝
      </div>

      <h1>Parceiros</h1>

      <p class="subtitulo">
        Conheça os parceiros do Nosso Modelo
      </p>

      <div
        class="contador"
        id="contador">

        🤝 Parceiros: <strong>0</strong>

      </div>

    </section>


    <!-- LISTA -->

    <section id="lista">

      <div class="card">

        <p class="vazio">

          <strong>🤝 Ainda não há parceiros</strong>

          Seja o primeiro a fazer parte
          do Nosso Modelo.

        </p>

      </div>

    </section>


    <!-- SEJA PARCEIRO -->

    <button
      class="parceiro"
      onclick="window.location.href='parceiro.html'">

      🤝 Seja Parceiro

    </button>


    <!-- VOLTAR -->

    <button
      class="voltar"
      onclick="window.location.href='index.html'">

      🏠 Voltar para início

    </button>


    <div class="rodape">

      Nosso Modelo © 2026<br>

      Empresas e parceiros

    </div>

  </main>


  <script>

    const lista =
      document.getElementById("lista");


    const parceiros =
      JSON.parse(
        localStorage.getItem("listaParceiros")
      ) || [];


    /* CONTADOR */

    document.getElementById("contador").innerHTML =
      "🤝 Parceiros: <strong>" +
      parceiros.length +
      "</strong>";


    /* LISTA */

    if (parceiros.length > 0) {

      lista.innerHTML = "";


      parceiros.forEach(function(parceiro) {

        const card =
          document.createElement("div");

        card.className = "card";


        /* CABEÇALHO */

        const cabecalho =
          document.createElement("div");

        cabecalho.className =
          "cabecalho-card";


        const iconeEmpresa =
          document.createElement("div");

        iconeEmpresa.className =
          "empresa-icone";

        iconeEmpresa.textContent =
          "🏢";


        const blocoTitulo =
          document.createElement("div");


        const etiqueta =
          document.createElement("div");

        etiqueta.className =
          "etiqueta";

        etiqueta.textContent =
          "PARCEIRO";


        const titulo =
          document.createElement("h2");

        titulo.textContent =
          parceiro.empresa || "Parceiro";


        blocoTitulo.appendChild(etiqueta);

        blocoTitulo.appendChild(titulo);

        cabecalho.appendChild(iconeEmpresa);

        cabecalho.appendChild(blocoTitulo);

        card.appendChild(cabecalho);


        /* NOME */

        const nome =
          document.createElement("p");

        nome.className =
          "informacao";

        nome.innerHTML =
          "<strong>👤 Nome:</strong> " +
          (parceiro.nome || "Não informado");

        card.appendChild(nome);


        /* EMAIL */

        const email =
          document.createElement("p");

        email.className =
          "informacao";

        email.innerHTML =
          "<strong>📧 E-mail:</strong> " +
          (parceiro.email || "Não informado");

        card.appendChild(email);


        /* WHATSAPP */

        if (parceiro.whatsapp) {

          const whatsapp =
            document.createElement("p");

          whatsapp.className =
            "informacao";

          whatsapp.innerHTML =
            "<strong>📱 WhatsApp:</strong> " +
            parceiro.whatsapp;

          card.appendChild(whatsapp);

        }


        /* MENSAGEM */

        const mensagem =
          document.createElement("div");

        mensagem.className =
          "mensagem";

        mensagem.innerHTML =
          "<strong>💬 Proposta</strong><br>" +
          (parceiro.mensagem || "Sem mensagem");

        card.appendChild(mensagem);


        /* DATA */

        const data =
          document.createElement("p");

        data.className =
          "data";

        data.textContent =
          "🕒 " +
          (parceiro.dataHora || "Data não informada");

        card.appendChild(data);


        /* EMAIL */

        if (parceiro.email) {

          const botaoEmail =
            document.createElement("button");

          botaoEmail.className =
            "email";

          botaoEmail.textContent =
            "📧 Contactar parceiro";

          botaoEmail.onclick =
            function() {

              window.location.href =
                "mailto:" + parceiro.email;

            };

          card.appendChild(botaoEmail);

        }


        /* WHATSAPP */

        if (parceiro.whatsapp) {

          const botaoWhatsApp =
            document.createElement("button");

          botaoWhatsApp.className =
            "whatsapp";

          botaoWhatsApp.textContent =
            "📱 Abrir WhatsApp";

          botaoWhatsApp.onclick =
            function() {

              const numero =
                parceiro.whatsapp
                  .replace(/\D/g, "");

              if (numero) {

                window.location.href =
                  "https://wa.me/" + numero;

              }

            };

          card.appendChild(botaoWhatsApp);

        }


        lista.appendChild(card);

      });

    }

  </script>

</body>
</html>
