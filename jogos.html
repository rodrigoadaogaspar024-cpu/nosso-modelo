<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Jogos - Nosso Modelo</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at top, #252525 0%, #0d0d0d 50%);
      color: white;
    }

    .container {
      width: 100%;
      max-width: 600px;
      margin: auto;
      padding: 20px 18px 35px;
    }

    /* TOPO */

    .topo {
      text-align: center;
      padding: 15px 0 25px;
    }

    .icone {
      width: 75px;
      height: 75px;
      margin: auto;
      border-radius: 22px;
      background: linear-gradient(145deg, #fff, #888);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 38px;
      box-shadow: 0 10px 30px rgba(255,255,255,0.12);
    }

    h1 {
      margin-top: 15px;
      font-size: 30px;
    }

    .subtitulo {
      color: #999;
      margin-top: 7px;
      font-size: 14px;
    }

    /* PONTOS */

    .pontos {
      background: linear-gradient(145deg, #292929, #151515);
      border: 1px solid #404040;
      border-radius: 24px;
      padding: 25px;
      text-align: center;
      box-shadow: 0 15px 35px rgba(0,0,0,0.35);
      margin-bottom: 20px;
    }

    .pontos p {
      color: #aaa;
      margin-bottom: 8px;
    }

    .numero {
      font-size: 58px;
      font-weight: bold;
    }

    .limite {
      color: #777;
      font-size: 13px;
      margin-top: 5px;
    }

    /* JOGO */

    .jogo {
      background: #181818;
      border: 1px solid #333;
      border-radius: 23px;
      padding: 25px 20px;
      text-align: center;
    }

    .jogo h2 {
      font-size: 22px;
      margin-bottom: 10px;
    }

    .jogo p {
      color: #999;
      line-height: 1.5;
    }

    .botao-jogar {
      width: 100%;
      padding: 18px;
      margin-top: 22px;
      border: none;
      border-radius: 15px;
      background: white;
      color: #111;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    .botao-jogar:active {
      transform: scale(0.97);
    }

    .botao-jogar:disabled {
      background: #444;
      color: #888;
      cursor: not-allowed;
    }

    /* RESULTADO */

    #resultado {
      min-height: 28px;
      margin-top: 20px;
      font-size: 17px;
      font-weight: bold;
      line-height: 1.5;
    }

    /* INFORMAÇÃO */

    .info {
      margin-top: 18px;
      background: #151515;
      border: 1px solid #292929;
      border-radius: 18px;
      padding: 18px;
      text-align: center;
    }

    .info p {
      color: #888;
      font-size: 13px;
      line-height: 1.5;
    }

    /* VOLTAR */

    .voltar {
      width: 100%;
      padding: 16px;
      margin-top: 18px;
      border: 1px solid #3b3b3b;
      border-radius: 14px;
      background: #242424;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .voltar:active {
      transform: scale(0.98);
    }

  </style>
</head>

<body>

  <main class="container">

    <!-- TOPO -->

    <section class="topo">

      <div class="icone">
        🎮
      </div>

      <h1>Jogos</h1>

      <p class="subtitulo">
        Jogue e acumule pontos no Nosso Modelo
      </p>

    </section>


    <!-- PONTOS -->

    <section class="pontos">

      <p>⭐ Seus pontos</p>

      <div class="numero">
        <span id="pontos">0</span>
      </div>

      <div class="limite">
        Limite máximo: 100 pontos
      </div>

    </section>


    <!-- JOGO -->

    <section class="jogo">

      <h2>🎯 Desafio dos Pontos</h2>

      <p>
        Clique no botão e descubra quantos pontos
        você vai ganhar!
      </p>

      <button
        id="botaoJogar"
        class="botao-jogar"
        onclick="jogar()">

        🎮 JOGAR AGORA

      </button>

      <div id="resultado"></div>

    </section>


    <!-- INFORMAÇÃO -->

    <section class="info">

      <p>
        🎁 Os pontos acumulados podem ser usados
        no sistema de recompensas do Nosso Modelo.
      </p>

    </section>


    <!-- VOLTAR -->

    <button
      class="voltar"
      onclick="window.location.href='index.html'">

      ← Voltar para o início

    </button>

  </main>


  <script>

    let pontos =
      Number(localStorage.getItem("pontosUsuario")) || 0;

    atualizarTela();


    function atualizarTela() {

      document.getElementById("pontos").textContent = pontos;

      const botao =
        document.getElementById("botaoJogar");

      if (pontos >= 100) {

        botao.disabled = true;

        botao.textContent =
          "🏆 LIMITE DE 100 PONTOS";

      }

    }


    function jogar() {

      if (pontos >= 100) {

        document.getElementById("resultado").textContent =
          "🏆 Você já chegou ao limite de 100 pontos!";

        return;

      }


      const ganho =
        Math.floor(Math.random() * 10) + 1;


      pontos += ganho;


      if (pontos > 100) {

        pontos = 100;

      }


      localStorage.setItem(
        "pontosUsuario",
        pontos
      );


      /* HISTÓRICO */

      let historico =
        JSON.parse(
          localStorage.getItem("historicoUsuario")
        ) || [];


      historico.unshift({

        tipo: "🎮 Jogo",

        descricao:
          "Você ganhou " + ganho + " pontos."

      });


      localStorage.setItem(
        "historicoUsuario",
        JSON.stringify(historico)
      );


      /* RESULTADO */

      if (ganho === 10) {

        document.getElementById("resultado").textContent =
          "🏆 PRÊMIO MÁXIMO! Você ganhou 10 pontos!";

      } else if (ganho >= 6) {

        document.getElementById("resultado").textContent =
          "💎 PRÊMIO ESPECIAL! Você ganhou " +
          ganho + " pontos!";

      } else {

        document.getElementById("resultado").textContent =
          "🎉 Você ganhou " +
          ganho + " pontos!";

      }


      atualizarTela();

    }

  </script>

</body>
</html>
