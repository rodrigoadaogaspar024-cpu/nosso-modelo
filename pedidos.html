<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Pedidos de Parceiros</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #111827, #1f2937);
      color: white;
      padding: 20px;
    }

    .container {
      max-width: 700px;
      margin: auto;
    }

    h1 {
      text-align: center;
      margin: 20px 0 10px;
    }

    .subtitulo {
      text-align: center;
      color: #cbd5e1;
      margin-bottom: 25px;
    }

    .contador {
      background: rgba(255,255,255,0.08);
      padding: 15px;
      border-radius: 15px;
      text-align: center;
      margin-bottom: 20px;
    }

    .pedido {
      background: white;
      color: #111827;
      padding: 20px;
      margin: 15px 0;
      border-radius: 18px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.25);
    }

    .pedido h2 {
      margin-bottom: 15px;
    }

    .pedido p {
      margin: 10px 0;
      line-height: 1.5;
      word-wrap: break-word;
    }

    .mensagem {
      background: #f3f4f6;
      padding: 12px;
      border-radius: 10px;
      margin-top: 5px;
    }

    .botoes {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 15px;
    }

    .botao {
      display: block;
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      text-align: center;
      text-decoration: none;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .email {
      background: #2563eb;
      color: white;
    }

    .whatsapp {
      background: #16a34a;
      color: white;
    }

    .apagar {
      background: #dc2626;
      color: white;
    }

    .vazio {
      background: white;
      color: #111827;
      padding: 30px 20px;
      border-radius: 18px;
      text-align: center;
      margin-top: 20px;
    }

    .voltar {
      background: #374151;
      color: white;
      margin-top: 20px;
    }
  </style>
</head>

<body>

  <div class="container" id="areaPedidos" hidden>

    <h1>🤝 Pedidos de Parceiros</h1>

    <p class="subtitulo">
      Pessoas e empresas interessadas em fazer parceria com o Nosso Modelo.
    </p>

    <div class="contador">
      📩 <strong id="contador">0</strong> pedido(s) registrado(s)
    </div>

    <div id="listaPedidos"></div>

    <button
      class="botao voltar"
      onclick="window.location.href='admin.html'">
      ⚙️ Voltar para Administração
    </button>

  </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>

  <script>
    (async function carregarPedidos() {
      const lista = document.getElementById("listaPedidos");
      const contador = document.getElementById("contador");
      const area = document.getElementById("areaPedidos");

      try {
        const cliente = window.supabase.createClient(
          SUPABASE_URL, SUPABASE_KEY
        );

        const { data: usuario, error: erroUsuario } =
          await cliente.auth.getUser();

        if (erroUsuario || !usuario.user) {
          window.location.replace("login-admin.html");
          return;
        }

        const { data: autorizado, error: erroAdmin } =
          await cliente.rpc("eh_administrador");

        if (erroAdmin || autorizado !== true) {
          await cliente.auth.signOut();
          window.location.replace("login-admin.html");
          return;
        }

        const { data: pedidos, error } = await cliente
          .from("parceiros")
          .select("id,nome,empresa,email,whatsapp,mensagem,criado_em,aprovado")
          .order("criado_em", { ascending: false });

        if (error) throw error;

        contador.textContent = pedidos.length;

        if (pedidos.length === 0) {
          lista.textContent = "📭 Nenhum pedido registrado.";
        }

        for (const pedido of pedidos) {
          const cartao = document.createElement("div");
          cartao.className = "pedido";

          const titulo = document.createElement("h2");
          titulo.textContent = pedido.empresa || "Empresa não informada";
          cartao.appendChild(titulo);

          const campos = [
            ["👤 Nome", pedido.nome],
            ["📧 E-mail", pedido.email],
            ["📱 WhatsApp", pedido.whatsapp],
            ["🕐 Data", pedido.criado_em
              ? new Date(pedido.criado_em).toLocaleString("pt-PT")
              : ""],
            ["📋 Situação", pedido.aprovado
              ? "Aprovado" : "Aguardando análise"],
            ["💬 Mensagem", pedido.mensagem]
          ];

          for (const [rotulo, valor] of campos) {
            const linha = document.createElement("p");
            const forte = document.createElement("strong");
            forte.textContent = rotulo + ": ";
            linha.appendChild(forte);
            linha.appendChild(
              document.createTextNode(valor || "")
            );
            cartao.appendChild(linha);
          }

          if (pedido.email) {
            const responder = document.createElement("a");
            responder.className = "botao email";
            responder.textContent = "📧 Responder por e-mail";
            responder.href = "mailto:" + encodeURIComponent(pedido.email);
            cartao.appendChild(responder);
          }

          if (pedido.whatsapp) {
            const numero = pedido.whatsapp.replace(/\D/g, "");
            if (numero) {
              const whatsapp = document.createElement("a");
              whatsapp.className = "botao whatsapp";
              whatsapp.textContent = "📱 Falar pelo WhatsApp";
              whatsapp.href = "https://wa.me/" + numero;
              whatsapp.target = "_blank";
              whatsapp.rel = "noopener noreferrer";
              cartao.appendChild(whatsapp);
            }
          }

          const botao = document.createElement("button");
          botao.type = "button";
          botao.className = "botao";
          botao.textContent = pedido.aprovado
            ? "❌ Retirar aprovação"
            : "✅ Aprovar parceiro";

          botao.addEventListener("click", async () => {
            const aprovar = !pedido.aprovado;

            const confirmado = confirm(
              aprovar
                ? "Deseja aprovar esta empresa?"
                : "Deseja retirar a aprovação desta empresa?"
            );

            if (!confirmado) return;

            botao.disabled = true;
            botao.textContent = "⏳ A guardar...";

            const { data, error } = await cliente
              .from("parceiros")
              .update({ aprovado: aprovar })
              .eq("id", pedido.id)
              .select("id,aprovado")
              .single();

            if (error || !data) {
              alert("Erro ao atualizar: " +
                (error?.message || "Sem confirmação"));
              botao.disabled = false;
              botao.textContent = pedido.aprovado
                ? "❌ Retirar aprovação"
                : "✅ Aprovar parceiro";
              return;
            }

            pedido.aprovado = data.aprovado;
            alert("✅ Situação atualizada com sucesso!");
            window.location.reload();
          });

          cartao.appendChild(botao);

          lista.appendChild(cartao);
        }

        area.hidden = false;

      } catch (erro) {
        console.error("Erro ao carregar pedidos:", erro);
        contador.textContent = "Erro";
        lista.textContent =
          "⚠️ Não foi possível carregar os pedidos.";
        area.hidden = false;
      }
    })();
  </script>

</body>
</html>
