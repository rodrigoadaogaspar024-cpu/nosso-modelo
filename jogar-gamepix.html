<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport"
 content="width=device-width,initial-scale=1">
<title>Jogar | Nosso Modelo</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;
 background:#100e0b;
 color:#ffe5a8;
 font-family:Arial,sans-serif;
 text-align:center;
}
header{padding:15px}
h1{font-size:22px}
iframe{
 display:block;
 width:100%;
 height:75dvh;
 min-height:450px;
 border:0;
 background:#111;
}
a{
 display:inline-block;
 padding:12px 18px;
 margin:12px;
 background:#e7bd60;
 color:#241807;
 border-radius:12px;
 text-decoration:none;
 font-weight:bold;
}
</style>
</head>
<body>
<header>
<h1 id="titulo">🎮 Nosso Modelo</h1>
<a href="catalogo.html">← Voltar ao catálogo</a>
</header>

<iframe id="jogo"
 title="Jogo GamePix"
 allow="fullscreen; autoplay"
 allowfullscreen></iframe>

<p id="aviso">A carregar jogo...</p>

<script src="gamepix-dados.js"></script>
<script>
const id=new URLSearchParams(location.search).get("id");
const jogo=(window.JOGOS_GAMEPIX||[])
 .find(j=>j.namespace===id);

if(jogo){
 document.getElementById("titulo").textContent=jogo.title;
 const url=new URL(jogo.url);
 if(url.protocol==="https:" &&
    url.hostname==="play.gamepix.com"){
   document.getElementById("jogo").src=url.href;
   document.getElementById("aviso").textContent=
    "Se o jogo não abrir, poderá existir uma restrição de incorporação.";
 }else{
   document.getElementById("aviso").textContent=
    "Endereço do jogo não permitido.";
 }
}else{
 document.getElementById("aviso").textContent=
  "Jogo não encontrado.";
}
</script>
</body>
</html>
