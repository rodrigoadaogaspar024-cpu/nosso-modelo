<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrar - Nosso Modelo</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;padding:20px;
  display:grid;place-items:center;
  background:linear-gradient(135deg,#101629,#20204b);
  color:white;font-family:Arial,sans-serif
}
main{
  width:100%;max-width:440px;padding:28px 22px;
  border-radius:20px;background:#1d2540;
  border:1px solid #44547a
}
h1{text-align:center;color:#ffdc80}
p{text-align:center;line-height:1.5}
label{display:block;margin-top:16px}
input{
  width:100%;padding:14px;margin-top:7px;
  border-radius:10px;border:1px solid #657293;
  background:#10182e;color:white;font-size:16px
}
button,.link{
  display:block;width:100%;padding:15px;
  margin-top:18px;border:0;border-radius:12px;
  background:#f5c75c;color:#171717;
  font-size:16px;font-weight:bold;
  text-align:center;text-decoration:none
}
button:disabled{opacity:.6}
.secundario{background:#34456c;color:white}
#mensagem{white-space:pre-line}
</style>
</head>
<body>
<main>
<h1>🎮 NOSSO MODELO</h1>
<p>Bem-vindo de volta! Entra na tua conta.</p>

<form id="formLogin">
<label for="email">📧 E-mail</label>
<input id="email" type="email" required
 autocomplete="email">

<label for="senha">🔐 Senha</label>
<input id="senha" type="password" required
 autocomplete="current-password">

<button id="botao" type="submit">
🔓 Entrar na minha conta
</button>
</form>

<button id="recuperarSenha" type="button" class="link secundario">
🔑 Esqueci minha senha
</button>

<p id="mensagem" role="status" aria-live="polite"></p>

<a class="link secundario" href="cadastro.html">
🚀 Criar uma conta
</a>

<a class="link secundario" href="index.html">
🏠 Voltar ao início
</a>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script>
const cliente = window.supabase.createClient(
  SUPABASE_URL, SUPABASE_KEY
);

document.getElementById("recuperarSenha")
.addEventListener("click", async function() {
  const email = document.getElementById("email").value.trim();
  const mensagem = document.getElementById("mensagem");
  const botao = document.getElementById("recuperarSenha");

  if (!email) {
    mensagem.textContent = "⚠️ Informa primeiro o teu e-mail.";
    return;
  }

  botao.disabled = true;
  mensagem.textContent = "⏳ A solicitar recuperação...";

  try {
    const { error } = await cliente.auth.resetPasswordForEmail(
      email,
      {
        redirectTo: new URL(
          "recuperar-senha.html",
          window.location.href
        ).href
      }
    );

    if (error) throw error;

    mensagem.textContent =
      "✅ Se o e-mail estiver cadastrado, receberás um link de recuperação. Verifica também o spam.";
  } catch (erro) {
    console.error("Erro de recuperação:", erro);
    mensagem.textContent =
      "⚠️ Não foi possível solicitar recuperação. Tenta novamente.";
  } finally {
    botao.disabled = false;
  }
});

document.getElementById("formLogin")
.addEventListener("submit", async function(event) {
  event.preventDefault();

  const email = document.getElementById("email").value.trim();
  const senha = document.getElementById("senha").value;
  const mensagem = document.getElementById("mensagem");
  const botao = document.getElementById("botao");

  botao.disabled = true;
  mensagem.textContent = "⏳ A entrar...";

  try {
    const { data, error } =
      await cliente.auth.signInWithPassword({
        email,
        password: senha
      });

    if (error) throw error;

    if (!data.user || !data.session) {
      throw new Error("Sessão não iniciada.");
    }

    mensagem.textContent = "✅ Login realizado com sucesso!";

    window.location.replace("perfil.html");
  } catch (erro) {
    mensagem.textContent =
      "⚠️ Não foi possível entrar. Confere o e-mail, a senha e a confirmação da conta.";
    console.error("Erro no login:", erro);
  } finally {
    botao.disabled = false;
  }
});
</script>
</body>
</html>
